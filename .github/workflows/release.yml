name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libx11-dev libx11-xcb-dev xvfb

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: xvfb-run cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Extract Tag or Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Package Linux tar.gz
        run: |
          mkdir -p target/release-linux/assets
          cp target/release/tiarun target/release-linux/
          cp installer/linux/install.sh target/release-linux/
          chmod 755 target/release-linux/tiarun target/release-linux/install.sh
          cp assets/tiarun.desktop assets/tiarun.png assets/tiarun.svg target/release-linux/assets/
          cp README.md LICENSE target/release-linux/ 2>/dev/null || true
          tar -czvf target/tiarun-linux-x86_64.tar.gz -C target/release-linux .

      - name: Build Debian (.deb) package
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p target/deb-pkg/usr/bin target/deb-pkg/usr/share/applications target/deb-pkg/usr/share/pixmaps target/deb-pkg/usr/share/icons/hicolor/scalable/apps target/deb-pkg/DEBIAN
          cp target/release/tiarun target/deb-pkg/usr/bin/
          chmod 755 target/deb-pkg/usr/bin/tiarun
          cp assets/tiarun.desktop target/deb-pkg/usr/share/applications/
          cp assets/tiarun.png target/deb-pkg/usr/share/pixmaps/
          cp assets/tiarun.svg target/deb-pkg/usr/share/pixmaps/
          cp assets/tiarun.svg target/deb-pkg/usr/share/icons/hicolor/scalable/apps/
          mkdir -p target/shlibs-tmp/debian
          printf 'Source: tiarun\n\nPackage: tiarun\nArchitecture: amd64\n' > target/shlibs-tmp/debian/control
          SHLIBS_DEPS=$(cd target/shlibs-tmp && dpkg-shlibdeps -O ../../target/release/tiarun | sed 's/^shlibs:Depends=//')
          rm -rf target/shlibs-tmp
          cat << EOF > target/deb-pkg/DEBIAN/control
          Package: tiarun
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: ${SHLIBS_DEPS:+${SHLIBS_DEPS}, }libxkbcommon0, libxkbcommon-x11-0, libfontconfig1, libwayland-client0, libegl1, libgl1, libx11-6, libx11-xcb1
          Recommends: wl-clipboard
          Maintainer: Hieu Nguyen <work.hieunguyen@gmail.com>
          Description: Think. Search. Run. - High-performance desktop launcher in Rust (<5ms)
          EOF
          cat << 'EOF' > target/deb-pkg/DEBIAN/postinst
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod 755 target/deb-pkg/DEBIAN/postinst
          dpkg-deb --build target/deb-pkg "target/tiarun_${VERSION}_amd64.deb"

      - name: Stage Linux release assets
        run: |
          mkdir -p target/dist-linux
          cp target/tiarun-linux-x86_64.tar.gz target/dist-linux/
          cp target/tiarun_*_amd64.deb target/dist-linux/

      - name: Upload Linux Assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: target/dist-linux/*

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows zip
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/tiarun.exe, README.md -DestinationPath target/tiarun-windows-x86_64.zip

      - name: Compile Inno Setup Installer
        run: |
          iscc installer\windows\setup.iss

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          mkdir -p target/dist-windows
          cp target/tiarun-windows-x86_64.zip target/dist-windows/
          cp installer/windows/Output/tiarun-setup.exe target/dist-windows/

      - name: Upload Windows Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: target/dist-windows/*

  publish-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten and Generate Checksums
        run: |
          mkdir -p release-files
          find release-assets -type f -exec cp {} release-files/ \;
          cd release-files
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          echo "=== RELEASE FILES TO PUBLISH ==="
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true

  sync-website:
    name: Sync Website Version & Links
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: resolve_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Update website files
        run: |
          python3 .github/scripts/sync_website_release.py \
            --tag "${{ steps.resolve_tag.outputs.TAG }}" \
            --assets-dir release-assets

      - name: Commit and push website sync
        env:
          TAG: ${{ steps.resolve_tag.outputs.TAG }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html website/en/index.html website/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore(website): sync release ${TAG}"
            git pull --rebase origin main
            git push origin main
          fi
