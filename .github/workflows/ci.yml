name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: Test & Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libx11-dev libx11-xcb-dev xvfb

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: xvfb-run cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Build Debian package
        run: |
          VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)
          mkdir -p target/deb-pkg/usr/bin target/deb-pkg/usr/share/applications target/deb-pkg/usr/share/pixmaps target/deb-pkg/usr/share/icons/hicolor/scalable/apps target/deb-pkg/DEBIAN
          cp target/release/tiarun target/deb-pkg/usr/bin/
          chmod 755 target/deb-pkg/usr/bin/tiarun
          cp assets/tiarun.desktop target/deb-pkg/usr/share/applications/
          cp assets/tiarun.png target/deb-pkg/usr/share/pixmaps/
          cp assets/tiarun.svg target/deb-pkg/usr/share/pixmaps/
          cp assets/tiarun.svg target/deb-pkg/usr/share/icons/hicolor/scalable/apps/
          mkdir -p target/shlibs-tmp/debian
          printf 'Source: tiarun\n\nPackage: tiarun\nArchitecture: amd64\n' > target/shlibs-tmp/debian/control
          SHLIBS_DEPS=$(cd target/shlibs-tmp && dpkg-shlibdeps -O ../../target/release/tiarun | sed 's/^shlibs:Depends=//')
          rm -rf target/shlibs-tmp
          cat << EOF > target/deb-pkg/DEBIAN/control
          Package: tiarun
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: ${SHLIBS_DEPS:+${SHLIBS_DEPS}, }libxkbcommon0, libxkbcommon-x11-0, libfontconfig1, libwayland-client0, libegl1, libgl1, libx11-6, libx11-xcb1
          Recommends: wl-clipboard
          Maintainer: Hieu Nguyen <work.hieunguyen@gmail.com>
          Description: Think. Search. Run. - High-performance desktop launcher in Rust (<5ms)
          EOF
          cat << 'EOF' > target/deb-pkg/DEBIAN/postinst
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod 755 target/deb-pkg/DEBIAN/postinst
          dpkg-deb --build target/deb-pkg "target/tiarun_${VERSION}_amd64.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            target/release/tiarun
            target/tiarun_*_amd64.deb

  test-windows:
    name: Test & Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Compile Inno Setup Installer
        run: |
          iscc installer\windows\setup.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            target/release/tiarun.exe
            installer/windows/Output/tiarun-setup.exe
