[package]
name = "tiarun"
version = "1.2.1"
edition = "2024"
authors = ["Hieu Nguyen <work.hieunguyen@gmail.com>"]
description = "A minimalist, high-performance desktop app & file launcher in Rust (<5ms)"
license = "MIT"
repository = "https://github.com/hieunx1024/tiarun"
homepage = "https://tiarun.vercel.app"
readme = "README.md"
keywords = ["launcher", "slint", "gui", "wayland", "fuzzy-search"]
categories = ["command-line-utilities", "gui"]

[lib]
name = "tiarun"
path = "src/lib.rs"

[[bin]]
name = "tiarun"
path = "src/main.rs"

[features]
default = ["x11", "wayland"]
x11 = ["dep:x11rb"]
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-plasma"]
layer-shell = []

[dependencies]
slint = { version = "=1.9.2", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2"] }
i-slint-backend-winit = "=1.9.2"
fuzzy-matcher = "0.3.7"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "bmp", "webp"] }
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
rayon = "1.10"
arboard = { version = "3.4", features = ["wayland-data-control"] }
serde_json = "1.0"
raw-window-handle = "0.6"
notify = "7"
md5 = "0.8.1"
url = "2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "0.13", features = ["allow-unsafe-code"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["staging", "client"], optional = true }
wayland-protocols-plasma = { version = "0.3", features = ["client"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
slint-build = "=1.9.2"

[package.metadata.deb]
name = "tiarun"
maintainer = "Hieu Nguyen <work.hieunguyen@gmail.com>"
copyright = "2026, Hieu Nguyen <work.hieunguyen@gmail.com>"
license-file = ["README.md", "4"]
extended-description = """\
A minimalist, high-performance desktop GUI app & file launcher in Rust (<5ms). \
Supports Wayland, X11, and Windows with native system icons, smart fuzzy search, \
Vietnamese accent normalization, inline calculator, and configurable paths."""
section = "utils"
priority = "optional"
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libfontconfig1, libwayland-client0, libegl1, libgl1, libx11-6, libx11-xcb1"
recommends = "wl-clipboard"
assets = [
    ["target/release/tiarun", "usr/bin/tiarun", "755"],
    ["assets/tiarun.desktop", "usr/share/applications/tiarun.desktop", "644"],
    ["assets/tiarun.svg", "usr/share/icons/hicolor/scalable/apps/tiarun.svg", "644"],
    ["assets/tiarun.png", "usr/share/pixmaps/tiarun.png", "644"],
    ["README.md", "usr/share/doc/tiarun/README.md", "644"],
]

[profile.release]
strip = true
lto = "thin"

