      <stop offset="0%" stop-color="#A3F4FF"/>
      <stop offset="30%" stop-color="#67E2FF"/>
      <stop offset="100%" stop-color="#27B8F5"/>
    </linearGradient>
    <linearGradient id="squircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181E2C"/>
